<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="16" fill="#070B14" stroke="#1E293B" stroke-width="2"/>
  <text x="40" y="42" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">3D END-TO-END PERCEPTION &amp; TELEMETRY PIPELINE</text>
  <text x="40" y="64" fill="#64748B" font-family="monospace" font-size="12">Low-latency WebSocket streaming across Browser Capture → Spring Boot 3.3 → PyTorch Hybrid CNN–Transformer</text>

  <!-- 3D Layer 1: Input Sources -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <polygon points="14,0 234,0 220,250 0,250" fill="url(#panelBg)" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="234,0 246,12 232,262 220,250" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="26" y="34" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">01 / INPUT STREAMS</text>
    <rect x="24" y="54" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="74" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Live Camera (WebRTC)</text>
    <text x="36" y="90" fill="#94A3B8" font-family="monospace" font-size="10">getUserMedia → JPEG</text>

    <rect x="24" y="110" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dashcam Video Upload</text>
    <text x="36" y="146" fill="#94A3B8" font-family="monospace" font-size="10">.mp4 / .webm / .mov</text>

    <rect x="24" y="166" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="186" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">5-Scenario Simulator</text>
    <text x="36" y="202" fill="#94A3B8" font-family="monospace" font-size="10">30+ FPS standalone</text>
  </g>

  <!-- Animated Connector 1 -> 2 -->
  <line x1="286" y1="235" x2="332" y2="235" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 3D Layer 2: Frontend HUD -->
  <g transform="translate(332, 110)" filter="url(#cardShadow)">
    <polygon points="14,0 234,0 220,250 0,250" fill="url(#panelBg)" stroke="#10B981" stroke-width="1.8"/>
    <polygon points="234,0 246,12 232,262 220,250" fill="#0B3328" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="26" y="34" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">02 / REACT + CANVAS HUD</text>
    <rect x="24" y="54" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="74" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ViewportHUD Engine</text>
    <text x="36" y="90" fill="#94A3B8" font-family="monospace" font-size="10">60 FPS rAF BBox &amp; Lanes</text>

    <rect x="24" y="110" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BEV Spatial Radar</text>
    <text x="36" y="146" fill="#94A3B8" font-family="monospace" font-size="10">10m / 25m / 50m Polar</text>

    <rect x="24" y="166" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="186" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Threat &amp; Video Dock</text>
    <text x="36" y="202" fill="#94A3B8" font-family="monospace" font-size="10">TTC / Logs / Ablation</text>
  </g>

  <!-- Animated Connector 2 -> 3 -->
  <line x1="578" y1="235" x2="624" y2="235" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 3D Layer 3: Spring Boot + MongoDB -->
  <g transform="translate(624, 110)" filter="url(#cardShadow)">
    <polygon points="14,0 234,0 220,250 0,250" fill="url(#panelBg)" stroke="#A78BFA" stroke-width="1.8"/>
    <polygon points="234,0 246,12 232,262 220,250" fill="#2A1D4D" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text x="26" y="34" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="700">03 / SPRING BOOT 3.3</text>
    <rect x="24" y="54" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="74" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WebSocket Bridge</text>
    <text x="36" y="90" fill="#94A3B8" font-family="monospace" font-size="10">ws://localhost:8000/ws/infer</text>

    <rect x="24" y="110" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ModelInferenceService</text>
    <text x="36" y="146" fill="#94A3B8" font-family="monospace" font-size="10">Frame Drop + Worker IPC</text>

    <rect x="24" y="166" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="186" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MongoDB Telemetry</text>
    <text x="36" y="202" fill="#94A3B8" font-family="monospace" font-size="10">Sessions &amp; AlertLogs</text>
  </g>

  <!-- Animated Connector 3 -> 4 -->
  <line x1="870" y1="235" x2="916" y2="235" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 3D Layer 4: PyTorch + ByteTrack -->
  <g transform="translate(916, 110)" filter="url(#cardShadow)">
    <polygon points="14,0 234,0 220,250 0,250" fill="url(#panelBg)" stroke="#F59E0B" stroke-width="1.8"/>
    <polygon points="234,0 246,12 232,262 220,250" fill="#422909" stroke="#F59E0B" stroke-opacity="0.5"/>
    <text x="26" y="34" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="700">04 / PYTORCH ENGINE</text>
    <rect x="24" y="54" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="74" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Hybrid CNN–Transformer</text>
    <text x="36" y="90" fill="#94A3B8" font-family="monospace" font-size="10">CSPDarknet + MHSA Neck</text>

    <rect x="24" y="110" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ByteTrack + GTSRB</text>
    <text x="36" y="146" fill="#94A3B8" font-family="monospace" font-size="10">2-Stage IoU + 43 Signs</text>

    <rect x="24" y="166" width="180" height="44" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="36" y="186" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ADASEngine TTC</text>
    <text x="36" y="202" fill="#94A3B8" font-family="monospace" font-size="10">Z = f·H / h_px → FCW/AEB</text>
  </g>
</svg>
