<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0A1122"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="418" x="1" y="1" rx="16" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- 3D Perspective Horizon & Grid -->
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#06B6D4" stroke-opacity="0.18" stroke-width="1"/>
  <g stroke="#06B6D4" stroke-opacity="0.12" stroke-width="1">
    <line x1="600" y1="220" x2="40" y2="420"/>
    <line x1="600" y1="220" x2="220" y2="420"/>
    <line x1="600" y1="220" x2="400" y2="420"/>
    <line x1="600" y1="220" x2="800" y2="420"/>
    <line x1="600" y1="220" x2="980" y2="420"/>
    <line x1="600" y1="220" x2="1160" y2="420"/>
    <line x1="250" y1="260" x2="950" y2="260"/>
    <line x1="160" y1="305" x2="1040" y2="305"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
  </g>

  <!-- 3D Drivable Corridor -->
  <polygon points="520,220 680,220 960,420 240,420" fill="url(#roadGrad)" stroke="#06B6D4" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Animated Center Lane Dashes -->
  <line x1="600" y1="224" x2="600" y2="420" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="18 22" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- 3D Isometric Target Vehicle Cube (Right Lane) -->
  <g transform="translate(650, 245)" filter="url(#glow)">
    <!-- 3D Box Faces -->
    <polygon points="0,20 70,20 90,5 20,5" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5"/>
    <rect x="0" y="20" width="70" height="44" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.8"/>
    <polygon points="70,20 90,5 90,49 70,64" fill="#10B981" fill-opacity="0.24" stroke="#10B981" stroke-width="1.5"/>
    <rect x="-2" y="2" width="110" height="16" rx="3" fill="#080B12" fill-opacity="0.85"/>
    <text x="4" y="13" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">ID:07 CAR 94% | 18.4m</text>
    <animateTransform attributeName="transform" type="translate" values="650,245; 655,248; 650,245" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- 3D Isometric Caution Vehicle Cube (Left Lane) -->
  <g transform="translate(435, 260)" filter="url(#glow)">
    <polygon points="0,16 58,16 74,4 16,4" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="0" y="16" width="58" height="36" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.8"/>
    <polygon points="58,16 74,4 74,40 58,52" fill="#F59E0B" fill-opacity="0.24" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="-2" y="-2" width="118" height="15" rx="3" fill="#080B12" fill-opacity="0.85"/>
    <text x="3" y="9" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="bold">ID:03 TRUCK | TTC 2.8s</text>
    <animateTransform attributeName="transform" type="translate" values="435,260; 430,263; 435,260" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Animated Horizontal Radar Scan Beam -->
  <rect x="0" y="220" width="1200" height="3" fill="url(#scanLine)">
    <animate attributeName="y" values="220;410;220" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top-Right Mini Animated BEV Radar -->
  <g transform="translate(1055, 115)">
    <circle cx="0" cy="0" r="72" fill="#0B1220" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#1E293B" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#1E293B" stroke-dasharray="3 3"/>
    <path d="M0,0 L-36,-62 A72,72 0 0,1 36,-62 Z" fill="#06B6D4" fill-opacity="0.22">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
    <circle cx="24" cy="-30" r="4" fill="#10B981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="-18" r="4" fill="#F59E0B">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-28" y="88" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold">BEV RADAR</text>
  </g>

  <!-- Hero Title & Badges -->
  <g transform="translate(54, 58)">
    <rect x="0" y="0" width="215" height="26" rx="13" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.5"/>
    <circle cx="16" cy="13" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">REAL-TIME ADAS PERCEPTION</text>

    <text x="0" y="72" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">HYBRID CNN–TRANSFORMER ADAS</text>
    <text x="0" y="104" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">
      CSPDarknet + Windowed Multi-Head Self-Attention · ByteTrack MOT · Pinhole TTC Telemetry
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 126)" font-family="monospace" font-size="11" font-weight="600">
      <rect x="0" y="0" width="142" height="26" rx="6" fill="#101522" stroke="#1E293B"/>
      <text x="12" y="17" fill="#10B981">React 18 + Canvas</text>

      <rect x="154" y="0" width="158" height="26" rx="6" fill="#101522" stroke="#1E293B"/>
      <text x="166" y="17" fill="#38BDF8">Spring Boot 3.3 WS</text>

      <rect x="324" y="0" width="148" height="26" rx="6" fill="#101522" stroke="#1E293B"/>
      <text x="336" y="17" fill="#F59E0B">PyTorch + YOLOv8</text>

      <rect x="484" y="0" width="128" height="26" rx="6" fill="#101522" stroke="#1E293B"/>
      <text x="496" y="17" fill="#A78BFA">MongoDB Logs</text>
    </g>
  </g>
</svg>
