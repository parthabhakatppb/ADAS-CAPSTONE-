# ─── Spring Boot Backend ─────────────────────────────────────────────────────
# Server configuration
server.address=0.0.0.0
server.port=8000

# MongoDB connection (local, fast timeout if mongod is not running)
spring.data.mongodb.uri=mongodb://localhost:27017/adas_capstone?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000
spring.data.mongodb.database=adas_capstone

# Python inference worker
app.inference.python-cmd=python

# Jackson serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.adas.capstone=DEBUG
logging.level.org.springframework.web.socket=INFO

# CORS (allow frontend dev server)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
